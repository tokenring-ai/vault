name: Build and Publish Vault

on:
  push:

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bun_target: bun-darwin-arm64
            artifact: vault-macos-arm64
          - os: macos-15-intel
            bun_target: bun-darwin-x64
            artifact: vault-macos-x64
          - os: ubuntu-latest
            bun_target: bun-linux-x64
            artifact: vault-linux-x64
          - os: ubuntu-24.04-arm
            bun_target: bun-linux-arm64
            artifact: vault-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Check package
        run: bun run build

      - name: Build executable
        run: bun build --compile --target=${{ matrix.bun_target }} ./cli.ts --outfile ./dist/${{ matrix.artifact }}

      - name: Check executable
        run: ./dist/${{ matrix.artifact }} --help

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ./dist/${{ matrix.artifact }}

  publish-npm:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install

      - uses: actions/download-artifact@v7
        with:
          pattern: vault-*
          path: ./artifacts
          merge-multiple: true

      - name: Stage platform executables
        run: |
          mkdir -p \
            dist/bin/darwin-arm64 \
            dist/bin/darwin-x64 \
            dist/bin/linux-x64 \
            dist/bin/linux-arm64
          cp artifacts/vault-macos-arm64 dist/bin/darwin-arm64/vault
          cp artifacts/vault-macos-x64 dist/bin/darwin-x64/vault
          cp artifacts/vault-linux-x64 dist/bin/linux-x64/vault
          cp artifacts/vault-linux-arm64 dist/bin/linux-arm64/vault
          cp vault-launcher.js dist/vault
          chmod +x dist/vault dist/bin/*/vault

      - name: Publish to NPM
        run: npm stage publish --provenance --access public

  create-release:
    runs-on: ubuntu-latest
    needs: [publish-npm]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: vault-*
          path: ./artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/vault-*
